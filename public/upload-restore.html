<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Upload uz Arweave</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #0d1117;
            color: #e6edf3;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 20px;
            color: #79c0ff;
        }
        .wallet-status {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            color: #8b949e;
        }
        .wallet-status.connected {
            color: #3fb950;
            border-color: #3fb950;
        }
        .drop-zone {
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .drop-zone.dragover {
            border-color: #79c0ff;
            background: rgba(121, 192, 255, 0.1);
        }
        .drop-zone p {
            color: #8b949e;
            font-size: 16px;
            margin: 0;
        }
        .file-list {
            margin-bottom: 16px;
        }
        .file-item {
            padding: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 8px;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer;
            background: linear-gradient(135deg, #238636 0%, #1a7f37 50%, #238636 100%);
            color: #fff;
            border: 1px solid rgba(63, 185, 80, 0.3);
            border-radius: 8px;
            width: 100%;
            margin-bottom: 8px;
        }
        button:disabled {
            background: #30363d;
            color: #8b949e;
            cursor: not-allowed;
        }
        button.secondary {
            background: #21262d;
            border-color: #30363d;
        }
        .status { 
            margin-top: 20px; 
            padding: 10px; 
            word-break: break-all;
            white-space: pre-wrap;
        }
        .success { color: #3fb950; }
        .error { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Upload failus uz Arweave</h1>
        
        <div class="wallet-status" id="walletStatus">
            ⚠️ Nav savienots maks
        </div>
        
        <button id="connectWalletBtn" class="secondary">🔗 Savienot maku</button>
        
        <div class="drop-zone" id="dropZone" style="margin-top: 16px;">
            <p>📁 Ievelc failus šeit</p>
            <p style="font-size: 12px; margin-top: 8px;">vai noklikšķini, lai izvēlētos</p>
            <input type="file" id="fileInput" multiple style="display: none;">
        </div>
        
        <div class="file-list" id="fileList"></div>
        
        <button id="uploadBtn" disabled>Augšupielādēt un izveidot manifestu</button>
        
        <div id="status" class="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    
    <script>
        let selectedFiles = [];
        let userSigner = null;
        let userAddress = null;
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        const connectWalletBtn = document.getElementById('connectWalletBtn');
        const walletStatus = document.getElementById('walletStatus');
        const statusEl = document.getElementById('status');
        
        // Maka savienošana
        connectWalletBtn.addEventListener('click', async function() {
            try {
                if (!window.ethereum) {
                    throw new Error('Nav instalēts MetaMask!');
                }
                
                walletStatus.textContent = '⏳ Savieno maku...';
                
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                
                walletStatus.textContent = '✅ Maks savienots: ' + userAddress;
                walletStatus.className = 'wallet-status connected';
                
                connectWalletBtn.textContent = '✅ Maks savienots';
                connectWalletBtn.disabled = true;
                
                // Pārbauda, vai ir Base Sepolia tīklā
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x14a34' }]
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x14a34',
                                chainName: 'Base Sepolia',
                                nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                                rpcUrls: ['https://sepolia.base.org'],
                                blockExplorerUrls: ['https://sepolia.basescan.org']
                            }]
                        });
                    }
                }
                
            } catch (error) {
                walletStatus.textContent = '❌ ' + error.message;
                walletStatus.className = 'wallet-status';
            }
        });
        
        // Failu izvēle
        dropZone.addEventListener('click', function() {
            fileInput.click();
        });
        
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
            
            const files = Array.from(e.dataTransfer.files);
            selectedFiles = [...selectedFiles, ...files];
            updateFileList();
        });
        
        fileInput.addEventListener('change', function() {
            const files = Array.from(fileInput.files);
            selectedFiles = [...selectedFiles, ...files];
            updateFileList();
        });
        
        function updateFileList() {
            fileList.innerHTML = '';
            
            if (selectedFiles.length === 0) {
                uploadBtn.disabled = true;
                return;
            }
            
            selectedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                
                const span = document.createElement('span');
                span.textContent = '📄 ' + file.name + ' (' + formatBytes(file.size) + ') ';
                
                const removeBtn = document.createElement('button');
                removeBtn.textContent = '✕';
                removeBtn.style.cssText = 'width: auto; padding: 4px 8px; margin: 0; background: #f85149; border: none; border-radius: 4px; cursor: pointer;';
                removeBtn.onclick = function() {
                    selectedFiles.splice(index, 1);
                    updateFileList();
                };
                
                div.appendChild(span);
                div.appendChild(removeBtn);
                fileList.appendChild(div);
            });
            
            uploadBtn.disabled = false;
        }
        
        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }
        
        // Augšupielāde (pagaidām tikai parāda failu sarakstu)
        uploadBtn.addEventListener('click', async function() {
            if (selectedFiles.length === 0) {
                alert('Vispirms izvēlies failus!');
                return;
            }
            
            if (!userAddress) {
                alert('Vispirms savieno maku!');
                return;
            }
            
            statusEl.textContent = '✅ Izvēlētie faili:\n\n';
            for (const file of selectedFiles) {
                statusEl.textContent += '📄 ' + file.name + ' (' + formatBytes(file.size) + ')\n';
            }
            statusEl.textContent += '\n✅ Maks: ' + userAddress;
            statusEl.className = 'status success';
        });
    </script>
</body>
</html>
